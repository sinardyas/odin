<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="AWS architecture: an app served to the internet from private subnets, with admin access via Client VPN">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .lbl   { font-size: 12px; fill: #1a1a1a; }
      .lbl-b { font-size: 12px; fill: #1a1a1a; font-weight: 700; }
      .tiny  { font-size: 10px; fill: #6b6b6b; }
      .tiny-w{ font-size: 10px; fill: #eef; }
      .zone  { font-size: 11px; fill: #6b6b6b; font-weight: 600; letter-spacing: 0.05em; }
    </style>
  </defs>

  <!-- Internet -->
  <ellipse cx="440" cy="34" rx="86" ry="24" fill="#eef" stroke="#889" stroke-width="1.5"/>
  <text x="440" y="30" text-anchor="middle" class="lbl-b">The Internet</text>
  <text x="440" y="45" text-anchor="middle" class="tiny">users + admin laptop</text>

  <!-- Internet Gateway -->
  <rect x="392" y="82" width="96" height="30" rx="4" fill="#fff" stroke="#b5651d" stroke-width="1.6"/>
  <text x="440" y="101" text-anchor="middle" class="lbl">Internet Gateway</text>

  <!-- VPC boundary -->
  <rect x="40" y="132" width="800" height="428" rx="10" fill="none" stroke="#8a4a12" stroke-width="2" stroke-dasharray="2 0"/>
  <text x="56" y="154" class="zone" fill="#8a4a12">VPC · your private network · 10.0.0.0/16</text>

  <!-- AZ A -->
  <rect x="62" y="168" width="360" height="372" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="78" y="188" class="zone">Availability Zone A</text>
  <!-- AZ B -->
  <rect x="458" y="168" width="360" height="372" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="474" y="188" class="zone">Availability Zone B</text>

  <!-- Public subnet A -->
  <rect x="78" y="202" width="328" height="150" rx="6" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="90" y="220" class="zone" fill="#2e7d32">PUBLIC subnet · 10.0.1.0/24</text>
  <!-- Public subnet B -->
  <rect x="474" y="202" width="328" height="150" rx="6" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="486" y="220" class="zone" fill="#2e7d32">PUBLIC subnet · 10.0.2.0/24</text>

  <!-- Private subnet A -->
  <rect x="78" y="368" width="328" height="150" rx="6" fill="#eef4fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="90" y="386" class="zone" fill="#1565c0">PRIVATE subnet · 10.0.11.0/24</text>
  <!-- Private subnet B -->
  <rect x="474" y="368" width="328" height="150" rx="6" fill="#eef4fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="486" y="386" class="zone" fill="#1565c0">PRIVATE subnet · 10.0.12.0/24</text>

  <!-- NAT Gateway (public A) -->
  <rect x="92" y="300" width="104" height="34" rx="4" fill="#fff" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="144" y="321" text-anchor="middle" class="lbl">NAT Gateway</text>

  <!-- Client VPN endpoint (public A) -->
  <rect x="270" y="300" width="120" height="34" rx="4" fill="#fff" stroke="#b5651d" stroke-width="1.4"/>
  <text x="330" y="316" text-anchor="middle" class="lbl">Client VPN</text>
  <text x="330" y="329" text-anchor="middle" class="tiny">endpoint</text>

  <!-- ALB spanning both public subnets -->
  <rect x="300" y="238" width="252" height="40" rx="6" fill="#2e7d32"/>
  <text x="426" y="255" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Application Load Balancer</text>
  <text x="426" y="270" text-anchor="middle" class="tiny-w">public-facing · spans both AZs</text>

  <!-- EC2 app servers (private A) -->
  <rect x="120" y="424" width="128" height="46" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="184" y="444" text-anchor="middle" class="lbl-b">EC2 app server</text>
  <text x="184" y="459" text-anchor="middle" class="tiny">no public IP</text>
  <!-- EC2 app servers (private B) -->
  <rect x="516" y="424" width="128" height="46" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.4"/>
  <text x="580" y="444" text-anchor="middle" class="lbl-b">EC2 app server</text>
  <text x="580" y="459" text-anchor="middle" class="tiny">no public IP</text>

  <!-- ===== FLOWS ===== -->
  <!-- Internet -> IGW -->
  <line x1="440" y1="58" x2="440" y2="80" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- IGW -> ALB (green, user request) -->
  <path d="M440,112 L440,236" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="450" y="180" class="tiny" fill="#2e7d32">① user HTTP request</text>

  <!-- ALB -> EC2 A (green) -->
  <path d="M340,278 C300,340 220,360 184,422" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <!-- ALB -> EC2 B (green) -->
  <path d="M512,278 C560,340 600,360 580,422" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="360" y="360" class="tiny" fill="#2e7d32">② forwarded to a private server</text>

  <!-- EC2 A -> NAT (blue dashed, outbound) -->
  <path d="M150,424 C130,390 138,360 144,336" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <!-- NAT -> IGW (outbound continues) implied -->
  <text x="60" y="360" class="tiny" fill="#1565c0">outbound</text>
  <text x="60" y="372" class="tiny" fill="#1565c0">updates ↑</text>

  <!-- Admin laptop -> Client VPN (orange) -->
  <path d="M500,44 C560,120 420,200 340,298" fill="none" stroke="#b5651d" stroke-width="1.8" stroke-dasharray="1 0" marker-end="url(#arrow)"/>
  <text x="470" y="130" class="tiny" fill="#b5651d">Ⓐ admin tunnels in</text>
  <!-- Client VPN -> EC2 A (orange) -->
  <path d="M320,334 C300,370 240,395 200,422" fill="none" stroke="#b5651d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="405" class="tiny" fill="#b5651d">Ⓑ reaches private server</text>

  <!-- Legend -->
  <g transform="translate(62,566)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="30" y="4" class="tiny">User request path (public → app)</text>
    <line x1="230" y1="0" x2="254" y2="0" stroke="#1565c0" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="260" y="4" class="tiny">Private outbound (via NAT)</text>
    <line x1="440" y1="0" x2="464" y2="0" stroke="#b5651d" stroke-width="2.5"/>
    <text x="470" y="4" class="tiny">Admin access (Client VPN)</text>
  </g>
</svg>
